plugins {
    id 'com.android.application'
    // Uncomment the line below ONLY after you complete the Firebase setup in the README (Step 6)
    // id 'com.google.gms.google-services'
}

android {
    namespace 'com.truedata.mobile'
    compileSdk 34

    defaultConfig {
        applicationId "com.truedata.mobile"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("TRUEDATA_KEYSTORE_PATH")
            if (ksPath != null) {
                storeFile file(ksPath)
                storePassword System.getenv("TRUEDATA_KEYSTORE_PASSWORD")
                keyAlias "truedata"
                keyPassword System.getenv("TRUEDATA_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("TRUEDATA_KEYSTORE_PATH") != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.biometric:biometric:1.1.0'

    // Push notifications (Firebase Cloud Messaging) - safe to leave here even before
    // you finish Firebase setup; it just won't do anything until google-services.json
    // is added and the plugin above is uncommented. See README Step 6.
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-messaging'
}
